version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campaign_planner_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: campaign_user
      POSTGRES_PASSWORD: campaign_pass
      POSTGRES_DB: campaign_planner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign_user -d campaign_planner"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
